name: code-judge-prod

x-server-build: &server-build
  context: .
  dockerfile: server/Dockerfile

x-server-env: &server-env
  NODE_ENV: production
  DATABASE_URL: postgresql://judge:${POSTGRES_PASSWORD}@db:5432/codejudge?schema=public
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the .env file}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: judge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file}
      POSTGRES_DB: codejudge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge -d codejudge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off job: applies database migrations, then exits
  migrate:
    build: *server-build
    image: code-judge-server
    command: ["npx", "prisma", "migrate", "deploy"]
    environment: *server-env
    depends_on:
      db:
        condition: service_healthy

  api:
    build: *server-build
    image: code-judge-server
    restart: unless-stopped
    command: ["node", "src/server.js"]
    environment:
      <<: *server-env
      PORT: "5000"
      TRUST_PROXY: "1"
      INVITE_CODE: ${INVITE_CODE:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Judges submissions. It starts sandbox containers through the host's Docker.
  worker:
    build: *server-build
    image: code-judge-server
    restart: unless-stopped
    command: ["node", "src/worker.js"]
    user: "0:0" # needs access to the Docker socket
    environment:
      <<: *server-env
      JUDGE_WORK_DIR: /tmp/judge
      WORKER_CONCURRENCY: "2"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/judge:/tmp/judge # same path inside and outside, see the notes below
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata: