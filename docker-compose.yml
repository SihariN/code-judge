services:
  db:
    image: postgres:16
    container_name: code-judge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: judge
      POSTGRES_PASSWORD: judge_dev_pw
      POSTGRES_DB: codejudge
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: code-judge-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata: