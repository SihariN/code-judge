services:
  db:
    image: postgres:16
    container_name: code-judge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: judge
      POSTGRES_PASSWORD: judge_dev_pw
      POSTGRES_DB: codejudge
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: