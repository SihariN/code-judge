services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in the .env file}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  api:
    environment:
      # Two proxies now sit in front of the API (Caddy, then nginx),
      # so Express must look two hops back to find the real client address
      TRUST_PROXY: "2"

volumes:
  caddy_data:
  caddy_config: