name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: judge
          POSTGRES_PASSWORD: judge_dev_pw
          POSTGRES_DB: codejudge_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U judge -d codejudge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://judge:judge_dev_pw@localhost:5433/codejudge_test?schema=public
      TEST_REDIS_URL: redis://localhost:6379

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Pull the sandbox image
        run: docker pull python:3.12-slim

      - name: Unit tests
        run: npm run test:unit

      - name: Sandbox tests
        run: npm run test:sandbox

      - name: API tests
        run: npm run test:api

  client:
    name: Client lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build